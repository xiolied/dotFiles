# Basic stuffs
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g  mouse on
set -g  set-clipboard on

# Split windows
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Reload
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Command line: hide the bar while typing, prompt only
bind : set -g status off \; command-prompt \; set -g status on

# Starting at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window Navigation
bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim style binds
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# bar position
set -g status-position bottom

thm_bg="#141415"
thm_fg="#cdcdcd"
thm_cyan="#9bb4bc"
thm_black="#1c1c24"
thm_gray="#333738"
thm_magenta="#bb9dbd"
thm_pink="#d8647e"
thm_red="#d8647e"
thm_green="#7fa563"
thm_yellow="#e0a363"
thm_blue="#7e98e8"
thm_orange="#e8b589"
thm_black4="#606079"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages (tmux command line)
set -g message-style "fg=${thm_fg},bg=${thm_bg},bold"
set -g message-command-style "fg=${thm_fg},bg=${thm_bg},bold"

# Panes
set -g pane-border-lines single
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows (lualine_c style: flat bold text, current in bright fg)
set -g window-status-activity-style "fg=${thm_yellow},bg=${thm_bg},bold"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_black4},bg=${thm_bg},bold"
set -g window-status-format " #I: #W "
set -g window-status-current-style "fg=${thm_fg},bg=${thm_bg},bold"
set -g window-status-current-format " #I: #W "

# Statusline - right side: path + clock block (lualine_y + lualine_z style)
set -g status-right "#[fg=${thm_fg},bg=${thm_bg},bold]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #{?client_prefix,#[bg=${thm_orange}],#[bg=${thm_black4}]}#[fg=${thm_bg},bold] %H:%M "

# Statusline - left side: session block (lualine_a style, insert color under prefix)
set -g status-left "#[fg=${thm_bg},bold]#{?client_prefix,#[bg=${thm_orange}],#[bg=${thm_black4}]} #S "

# Modes
set -g clock-mode-colour "${thm_black4}"
set -g mode-style "fg=${thm_bg} bg=${thm_cyan} bold"
